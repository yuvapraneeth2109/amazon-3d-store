<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR View - Amazon 3D Showcase</title>
    <!-- Google Model Viewer Web Component for AR support -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #f8f9fa;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 16px;
        background: #ffffff;
        border-bottom: 1px solid #e9ecef;
        text-align: center;
      }
      header h1 {
        font-size: 1.2rem;
        color: #1a1a1a;
      }
      model-viewer {
        width: 100%;
        height: 100%;
        --poster-color: transparent;
      }
      .ar-button {
        position: absolute;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%);
        background: #000000;
        color: #ffffff;
        padding: 14px 28px;
        border-radius: 30px;
        border: none;
        font-weight: 600;
        font-size: 1rem;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="product-title">Loading 3D Model...</h1>
    </header>

    <model-viewer
      id="ar-viewer"
      camera-controls
      touch-action="pan-y"
      ar
      ar-modes="webxr scene-viewer quick-look"
      shadow-intensity="1"
      alt="A 3D model of furniture">
      <button slot="ar-button" class="ar-button">
        📱 View in your Room (AR)
      </button>
    </model-viewer>

    <script type="module" src="/src/ar.js"></script>
  </body>
</html>
