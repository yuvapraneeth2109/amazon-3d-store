<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Sofa Collection</title>
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"
    ></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #f5f5f7;
        padding: 40px 20px;
      }
      .header-title {
        text-align: center;
        font-size: 32px;
        font-weight: 700;
        color: #1d1d1f;
        margin-bottom: 40px;
      }
      .catalog-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 30px;
        max-width: 1400px;
        margin: 0 auto;
      }
      .card {
        background: #ffffff;
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
      }
      .viewer-container {
        width: 100%;
        height: 320px;
        background-color: #fafafa;
        border-radius: 16px;
        overflow: hidden;
        margin-bottom: 20px;
      }
      model-viewer {
        width: 100%;
        height: 100%;
      }
      .title {
        font-size: 20px;
        font-weight: 700;
        color: #1d1d1f;
        margin-bottom: 6px;
      }
      .price {
        font-size: 18px;
        font-weight: 600;
        color: #1d1d1f;
        margin-bottom: 16px;
      }
      .section-label {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #86868b;
        margin-bottom: 10px;
      }
      .texture-options {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
      }
      .swatch {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
        transition: transform 0.2s, border-color 0.2s;
      }
      .swatch.selected {
        border-color: #0071e3;
        transform: scale(1.1);
      }
      .swatch-red {
        background-color: #801822;
      }
      .swatch-blue {
        background-color: #1a365d;
      }
      .ar-btn {
        width: 100%;
        background-color: #000000;
        color: #ffffff;
        border: none;
        border-radius: 12px;
        padding: 14px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: auto;
        transition: background-color 0.2s;
      }
      .ar-btn:hover {
        background-color: #2c2c2e;
      }
    </style>
  </head>
  <body>
    <h1 class="header-title">3D Sofa Collection</h1>

    <div class="catalog-grid">
      <!-- Card 1 -->
      <div class="card" data-model="/models/model1.glb">
        <div class="viewer-container">
          <model-viewer
            src="/models/model1.glb"
            camera-controls
            touch-action="pan-y"
            auto-rotate
            shadow-intensity="1"
            max-camera-orbit="auto 85deg auto"
            min-camera-orbit="auto auto 1.5m"
            min-field-of-view="35deg"
            environment-image="/HDR_Avataar_engine.hdr"
          ></model-viewer>
        </div>
        <h2 class="title">Nordic Accent Sofa (Model 1)</h2>
        <div class="price">$389.99</div>
        <div class="section-label">Select Texture</div>
        <div class="texture-options">
          <div class="swatch swatch-red selected" data-texture="red"></div>
          <div class="swatch swatch-blue" data-texture="blue"></div>
        </div>
        <button class="ar-btn">🕶️ View in VR / AR</button>
      </div>

      <!-- Card 2 -->
      <div class="card" data-model="/models/model2.glb">
        <div class="viewer-container">
          <model-viewer
            src="/models/model2.glb"
            camera-controls
            touch-action="pan-y"
            auto-rotate
            shadow-intensity="1"
            max-camera-orbit="auto 85deg auto"
            min-camera-orbit="auto auto 1.5m"
            min-field-of-view="35deg"
            environment-image="/HDR_Avataar_engine.hdr"
          ></model-viewer>
        </div>
        <h2 class="title">Nordic Accent Sofa (Model 2)</h2>
        <div class="price">$429.99</div>
        <div class="section-label">Select Texture</div>
        <div class="texture-options">
          <div class="swatch swatch-red selected" data-texture="red"></div>
          <div class="swatch swatch-blue" data-texture="blue"></div>
        </div>
        <button class="ar-btn">🕶️ View in VR / AR</button>
      </div>

      <!-- Card 3 -->
      <div class="card" data-model="/models/model3.glb">
        <div class="viewer-container">
          <model-viewer
            src="/models/model3.glb"
            camera-controls
            touch-action="pan-y"
            auto-rotate
            shadow-intensity="1"
            max-camera-orbit="auto 85deg auto"
            min-camera-orbit="auto auto 1.5m"
            min-field-of-view="35deg"
            environment-image="/HDR_Avataar_engine.hdr"
          ></model-viewer>
        </div>
        <h2 class="title">Nordic Accent Sofa (Model 3)</h2>
        <div class="price">$459.99</div>
        <div class="section-label">Select Texture</div>
        <div class="texture-options">
          <div class="swatch swatch-red selected" data-texture="red"></div>
          <div class="swatch swatch-blue" data-texture="blue"></div>
        </div>
        <button class="ar-btn">🕶️ View in VR / AR</button>
      </div>

      <!-- Card 4 -->
      <div class="card" data-model="/models/model4.glb">
        <div class="viewer-container">
          <model-viewer
            src="/models/model4.glb"
            camera-controls
            touch-action="pan-y"
            auto-rotate
            shadow-intensity="1"
            max-camera-orbit="auto 85deg auto"
            min-camera-orbit="auto auto 1.5m"
            min-field-of-view="35deg"
            environment-image="/HDR_Avataar_engine.hdr"
          ></model-viewer>
        </div>
        <h2 class="title">Nordic Accent Sofa (Model 4)</h2>
        <div class="price">$499.99</div>
        <div class="section-label">Select Texture</div>
        <div class="texture-options">
          <div class="swatch swatch-red selected" data-texture="red"></div>
          <div class="swatch swatch-blue" data-texture="blue"></div>
        </div>
        <button class="ar-btn">🕶️ View in VR / AR</button>
      </div>

      <!-- Card 5 -->
      <div class="card" data-model="/models/model5.glb">
        <div class="viewer-container">
          <model-viewer
            src="/models/model5.glb"
            camera-controls
            touch-action="pan-y"
            auto-rotate
            shadow-intensity="1"
            max-camera-orbit="auto 85deg auto"
            min-camera-orbit="auto auto 1.5m"
            min-field-of-view="35deg"
            environment-image="/HDR_Avataar_engine.hdr"
          ></model-viewer>
        </div>
        <h2 class="title">Nordic Accent Sofa (Model 5)</h2>
        <div class="price">$529.99</div>
        <div class="section-label">Select Texture</div>
        <div class="texture-options">
          <div class="swatch swatch-red selected" data-texture="red"></div>
          <div class="swatch swatch-blue" data-texture="blue"></div>
        </div>
        <button class="ar-btn">🕶️ View in VR / AR</button>
      </div>
    </div>

    <script>
      const MIN_ALLOWED_RADIUS = 1.5;
      const MIN_ALLOWED_FOV = 35;

      // Function to apply texture maps to a specific card's viewer
      async function applyTexturesToViewer(viewer, textureKey) {
        if (!viewer.model || !viewer.model.materials) return;

        for (const material of viewer.model.materials) {
          const matName = material.name || '';
          const matMatch = matName.match(/Fabric_Mat_[A-G]/i);
          const targetMatName = matMatch ? matMatch[0] : 'Fabric_Mat_A';
          const basePath = `/textures/${textureKey}/${targetMatName}`;

          try {
            const baseColorTex = await viewer.createTexture(`${basePath}_BaseColor.jpg`);
            if (material.pbrMetallicRoughness) {
              material.pbrMetallicRoughness.baseColorTexture.setTexture(baseColorTex);
            }

            const normalTex = await viewer.createTexture(`${basePath}_Normal.jpg`);
            if (material.normalTexture) {
              material.normalTexture.setTexture(normalTex);
            }

            const roughTex = await viewer.createTexture(`${basePath}_Roughness.jpg`);
            if (material.pbrMetallicRoughness) {
              material.pbrMetallicRoughness.metallicRoughnessTexture.setTexture(roughTex);
            }
          } catch (err) {
            console.warn(`Could not apply texture map for ${targetMatName}:`, err);
          }
        }
      }

      // Initialize logic independently for each product card
      document.querySelectorAll('.card').forEach(card => {
        const viewer = card.querySelector('model-viewer');
        const swatches = card.querySelectorAll('.swatch');
        const arBtn = card.querySelector('.ar-btn');
        const modelUrl = card.getAttribute('data-model');
        let selectedTexture = 'red';

        // Camera zoom guard per card
        viewer.addEventListener('camera-change', () => {
          const orbit = viewer.getCameraOrbit();
          const fov = viewer.getFieldOfView();

          if (orbit && orbit.radius < MIN_ALLOWED_RADIUS) {
            viewer.cameraOrbit = `${orbit.theta}rad ${orbit.phi}rad ${MIN_ALLOWED_RADIUS}m`;
          }
          if (fov && fov < MIN_ALLOWED_FOV) {
            viewer.fieldOfView = `${MIN_ALLOWED_FOV}deg`;
          }
        });

        // Re-apply selected texture when model finishes loading
        viewer.addEventListener('load', () => {
          applyTexturesToViewer(viewer, selectedTexture);
        });

        // Texture swatch handler per card
        swatches.forEach(swatch => {
          swatch.addEventListener('click', async () => {
            swatches.forEach(s => s.classList.remove('selected'));
            swatch.classList.add('selected');
            selectedTexture = swatch.getAttribute('data-texture');
            await applyTexturesToViewer(viewer, selectedTexture);
          });
        });

        // AR button handler per card
        arBtn.addEventListener('click', () => {
          window.location.href = `ar.html?model=${encodeURIComponent(modelUrl)}&texture=${selectedTexture}`;
        });
      });
    </script>
  </body>
</html>
