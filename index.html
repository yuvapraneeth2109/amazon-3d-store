<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazon 3D Showcase</title>
  </head>
  <body>
    <header>
      <h1>Amazon 3D Showcase</h1>
    </header>
    <main>
      <h2>Featured 3D Products</h2>
      <div id="product-grid"></div>
    </main>

    <!-- QR Code Popup Modal -->
    <div id="qr-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <button id="modal-close" class="close-btn">&times;</button>
        <h3>Scan to View in VR / AR</h3>
        <p>Use your phone camera to scan the QR code and view this sofa in your space.</p>
        <div class="qr-container">
          <canvas id="qr-canvas"></canvas>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
